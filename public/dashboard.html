<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f5f5f5; }
    .upload-tabs { margin: 20px 0; }
    .tab-button { padding: 10px 20px; cursor: pointer; margin-right: 5px; }
    .tab-button.active { background-color: #007bff; color: white; }
    .upload-section { display: none; margin-bottom: 20px; }
    .upload-section.active { display: block; }
    .success-message { color: green; margin: 10px 0; display: none; }
    .success-message.show { display: block; }
    #fileList li { margin-bottom: 15px; list-style: none; border: 1px solid #ddd; padding: 10px; border-radius: 5px; }
    .file-item-header { display: flex; justify-content: space-between; align-items: center; }
    .file-actions button, .file-actions a { margin-left: 5px; }
    .text-content { width: 100%; height: 100px; margin-top: 10px; padding: 5px; resize: vertical; }
  </style>
</head>

<body>
  <div class="dashboard-header">
    <h1>File Dashboard</h1>
    <a href="/logout">Logout</a>
  </div>

  <div id="successMessage" class="success-message"></div>

  <div class="upload-tabs">
    <button class="tab-button active" onclick="switchTab('file', event)">Upload File</button>
    <button class="tab-button" onclick="switchTab('text', event)">Create Text File</button>
  </div>

  <!-- FILE UPLOAD -->
  <div id="fileUploadSection" class="upload-section active">
    <form id="uploadForm">
      <input type="file" id="fileInput" name="file" required>
      <button type="button" id="uploadBtn" onclick="uploadFile()">Upload File</button>
    </form>
  </div>

  <!-- TEXT FILE -->
  <div id="textUploadSection" class="upload-section">
    <form id="textUploadForm" onsubmit="uploadText(event)">
      <input type="text" name="filename" placeholder="File name (e.g., notes.txt)" required>
      <textarea name="content" placeholder="Enter your text content here..." required></textarea>
      <button type="submit" id="textUploadBtn">Create Text File</button>
    </form>
  </div>

  <h2>Your Files</h2>
  <ul id="fileList"></ul>

  <script>
    function switchTab(tab, event) {
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('fileUploadSection').classList.remove('active');
      document.getElementById('textUploadSection').classList.remove('active');
      document.getElementById(tab === 'file' ? 'fileUploadSection' : 'textUploadSection').classList.add('active');
    }

    /* FILE UPLOAD WITH STATUS */
    async function uploadFile() {
      const input = document.getElementById("fileInput");
      const btn = document.getElementById("uploadBtn");

      if (!input.files.length) return;

      btn.disabled = true;
      btn.textContent = "Uploading...";

      const formData = new FormData();
      formData.append("file", input.files[0]);

      try {
        const res = await fetch("/api/upload", { method: "POST", body: formData });
        if (res.ok) {
          showSuccess("Upload completed!");
          setTimeout(() => location.reload(), 800);
        }
      } catch (err) {
        console.error(err);
      }
    }

    /* TEXT FILE UPLOAD WITH STATUS */
    async function uploadText(event) {
      event.preventDefault();

      const btn = document.getElementById("textUploadBtn");
      btn.disabled = true;
      btn.textContent = "Uploading...";

      const form = event.target;
      const blob = new Blob([form.content.value], { type: 'text/plain' });
      const file = new File([blob], form.filename.value, { type: 'text/plain' });

      const fd = new FormData();
      fd.append("file", file);

      try {
        const res = await fetch("/api/upload", { method: "POST", body: fd });
        if (res.ok) {
          showSuccess("Text file created!");
          setTimeout(() => location.reload(), 800);
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadFiles() {
      const res = await fetch("/api/files");
      const files = await res.json();
      const list = document.getElementById("fileList");
      list.innerHTML = "";

      files.forEach(file => {
        const isText = file.mimetype === "text/plain";
        const li = document.createElement("li");

        li.innerHTML = `
          <div class="file-item-header">
            <span class="file-name">${file.filename}</span>
            <div class="file-actions">
              ${isText ? `
                <button onclick="toggleText('${file.id}')">Preview / Edit</button>
                <button onclick="copyText('${file.id}')">Copy</button>
                <button onclick="saveText('${file.id}')">Save</button>
              ` : ""}
              <a href="/api/files/download/${file.id}">Download</a>
              <button onclick="deleteFile('${file.id}')">Delete</button>
            </div>
          </div>
          ${isText ? `<textarea id="text-${file.id}" class="text-content" readonly></textarea>` : ""}
        `;
        list.appendChild(li);
      });
    }

    async function deleteFile(id) {
      if (!confirm("Delete this file?")) return;
      const res = await fetch(`/api/files/delete/${id}`, { method: "DELETE" });
      if (res.ok) {
        showSuccess("File deleted!");
        setTimeout(() => location.reload(), 600);
      }
    }

    function showSuccess(msg) {
      const el = document.getElementById("successMessage");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3000);
    }

    window.onload = loadFiles;
  </script>
</body>
</html>
